name: GetUp Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # Set to 1 hour (max for Pinggy free server)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run Docker Container
        run: |
          docker build -t agrigo-app .
          docker run -d -p 5000:5000 --name running-app agrigo-app

      - name: Install Pinggy (SSH Client)
        run: |
          sudo apt update && sudo apt install -y openssh-client

      - name: Start and Restart Pinggy Tunnel
        env:
          PINGGY_ACCESS_TOKEN: ${{ secrets.PINGGY_ACCESS_TOKEN }}
        run: |
          start_pinggy() {
            echo "Starting Pinggy tunnel..."
            nohup ssh -p 443 -R0:localhost:5000 -L4300:localhost:4300 \
              -o StrictHostKeyChecking=no -o ServerAliveInterval=30 \
              -t "$PINGGY_ACCESS_TOKEN"@a.pinggy.io x:https > pinggy.log 2>&1 &
            sleep 5
            echo "Pinggy tunnel started successfully."
          }

          # Start Pinggy first time
          start_pinggy

          # Restart Pinggy before 1-hour limit (every 55 minutes)
          sleep 3300  # 55 minutes
          echo "Restarting Pinggy tunnel..."
          pkill ssh  # Kill existing Pinggy SSH session
          start_pinggy

          echo "GitHub Actions job completed after 1 hour."
