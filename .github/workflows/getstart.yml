name: GetUp Action

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 360  # Maximum 6 hours allowed by GitHub Actions

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Run Docker Container
        run: |
          docker build -t agrigo-app .
          docker run -d -p 5000:5000 --name running-app agrigo-app

      - name: Install Ngrok
        run: |
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok

      - name: Start and Manage Ngrok Tunnel
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          ngrok authtoken $NGROK_AUTH_TOKEN

          restart_ngrok() {
            echo "Starting Ngrok tunnel..."
            nohup ngrok http 5000 > ngrok.log 2>&1 &
            sleep 5  # Give ngrok time to start
            NGROK_URL=$(curl -s http://localhost:4040/api/tunnels | jq -r '.tunnels[0].public_url')
            echo "Ngrok Tunnel URL: $NGROK_URL"
          }

          # Start Ngrok first time
          restart_ngrok

          # Keep restarting Ngrok every 110 minutes before it expires
          for i in {1..3}; do  # 3 restarts (110 min x 3 = 5.5 hours)
            sleep 6600  # 110 minutes
            echo "Restarting Ngrok tunnel..."
            pkill ngrok  # Kill existing Ngrok process
            restart_ngrok
          done

          echo "GitHub Actions limit reached (6 hours). Workflow will stop."
