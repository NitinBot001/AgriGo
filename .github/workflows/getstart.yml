name: Persistent Pinggy Tunnel Refresh Every 55 Minutes

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build and Run Docker Container
        run: |
          docker build -t myapp .
          docker run -d -p 5000:5000 --name myapp_container myapp
          sleep 10  # Wait for the app to start

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y openssh-client

      - name: Start and Refresh Pinggy Tunnel Every 55 Minutes
        run: |
          for i in {1..6}; do  # 6 times = 6 hours (each loop = 55 min)
            echo "Starting new Pinggy tunnel - Attempt $i/6"

            # Start a new Pinggy tunnel and extract URL
            nohup npx nport -s hdheheh -p 11434 > pinggy_output.txt 2>&1 &

            sleep 15  # Allow time for tunnel to start

            # Extract actual tunnel URL (ignore "https://server.nport.link/")
            TUNNEL_URL=$(grep -o 'https://[^ ]*' pinggy_output.txt | grep -v 'dashboard.pinggy.io' | head -n 1)

            if [[ -z "$TUNNEL_URL" ]]; then
              echo "Error: Could not fetch valid Pinggy Tunnel URL!"
              exit 1
            fi

            echo "Generated Tunnel URL: $TUNNEL_URL"

            # Save the tunnel URL to instance.json
            echo "{ \"tunnel_url\": \"$TUNNEL_URL\" }" > instance.json

            # Commit and push only if file has changed
            git diff --quiet && echo "No changes to commit" || (
              git config --global user.email "github-actions@github.com"
              git config --global user.name "GitHub Actions"
              git add instance.json
              git commit -m "Updated tunnel URL"
              git push
            )

            # Wait for 55 minutes before creating a new tunnel
            echo "Waiting for 55 minutes before refreshing tunnel..."
            sleep 3300  # 55 minutes in seconds
          done
