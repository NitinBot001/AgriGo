name: Auto Deploy with nport

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t myapp .

      - name: Run Docker container
        run: |
          docker run -d -p 5000:5000 --name myapp_container myapp
          sleep 10  # Wait for the app to start

      - name: Install Node.js and nport
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g nport

      - name: Generate Random Subdomain and Start nport Tunnel
        run: |
          # Generate a 10-character random alphanumeric string for the subdomain
          SUBDOMAIN=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 10 | head -n 1)

          # Start nport tunnel and extract the URL
          TUNNEL_URL=$(nport -s $SUBDOMAIN -p 5000 | grep -o 'https://[^ ]*')

          echo "Generated Tunnel URL: $TUNNEL_URL"

          # Save the tunnel URL to instance.json
          echo "{ \"tunnel_url\": \"$TUNNEL_URL\" }" > instance.json

      - name: Commit Updated Tunnel URL
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add instance.json
          git commit -m "Updated tunnel URL"
          git push
