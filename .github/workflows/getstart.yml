name: Auto Deploy with Pinggy

on:
  schedule:
    - cron: "0 */6 * * *"  # Runs every 6 hours
  workflow_dispatch:  # Allows manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t myapp .

      - name: Run Docker container
        run: |
          docker run -d -p 5000:5000 --name myapp_container myapp
          sleep 10  # Wait for the app to start

      - name: Start Pinggy Tunnel
        run: |
          # Start Pinggy tunnel and capture the output
          nohup ssh -p 443 -R0:localhost:5000 -o StrictHostKeyChecking=no \
            -o ServerAliveInterval=30 -t vzrUptnpbIY@a.pinggy.io x:https > pinggy_output.txt 2>&1 &

          # Wait for tunnel to establish
          sleep 10

          # Extract tunnel URL from output
          TUNNEL_URL=$(grep -o 'https://[^ ]*' pinggy_output.txt | head -n 1)

          echo "Generated Tunnel URL: $TUNNEL_URL"

          # Save the tunnel URL to instance.json
          echo "{ \"tunnel_url\": \"$TUNNEL_URL\" }" > instance.json

      - name: Commit Updated Tunnel URL
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add instance.json
          git commit -m "Updated tunnel URL"
          git push
