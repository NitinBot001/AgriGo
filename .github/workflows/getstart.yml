name: Auto Deploy with nport

on:
  schedule:
    - cron: "0 */6 * * *"  # हर 6 घंटे पर रन होगा
  workflow_dispatch:  # मैन्युअली भी ट्रिगर किया जा सकता है

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: रेपो को क्लोन करें
        uses: actions/checkout@v4

      - name: Docker बिल्ड करें
        run: |
          docker build -t myapp .

      - name: Docker कंटेनर रन करें
        run: |
          docker run -d -p 5000:5000 --name myapp_container myapp
          sleep 10  # कुछ सेकंड वेट करें ताकि ऐप स्टार्ट हो जाए

      - name: Node.js और nport इंस्टॉल करें
        run: |
          curl -fsSL https://deb.nodesource.com/setup_18.x | sudo -E bash -
          sudo apt-get install -y nodejs
          npm install -g nport

      - name: कस्टम सबडोमेन जेनरेट करें और टनल स्टार्ट करें
        run: |
          # 10-अक्षरों की रैंडम अल्फ़ान्यूमेरिक स्ट्रिंग बनाएं
          SUBDOMAIN=$(cat /dev/urandom | tr -dc 'a-z0-9' | fold -w 10 | head -n 1)

          # टनलिंग शुरू करें और URL प्राप्त करें
          TUNNEL_URL=$(nport -s $SUBDOMAIN -p 5000 | grep -o 'https://[^ ]*')

          echo "Generated Tunnel URL: $TUNNEL_URL"

          # instance.json में टनल URL सेव करें
          echo "{ \"tunnel_url\": \"$TUNNEL_URL\" }" > instance.json

      - name: Updated tunnel URL को कमिट करें
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          git add instance.json
          git commit -m "Updated tunnel URL"
          git push
